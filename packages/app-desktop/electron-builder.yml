appId: com.yggdrasil.desktop
productName: Yggdrasil
executableName: yggdrasil-desktop

# Native deps are rebuilt for Electron by the package's `postinstall`
# (`electron-rebuild --only better-sqlite3`). node-pty ships N-API prebuilds
# (prebuilds/<platform>-<arch>/pty.node) that load in Electron as-is, and
# rebuilding it from source needs MSVC Spectre-mitigated libs on Windows,
# so electron-builder's own rebuild pass is turned off.
npmRebuild: false

directories:
  output: release
  buildResources: resources

files:
  - dist/**
  - package.json

# License texts users are entitled to: this project's MIT LICENSE and the
# notices of every bundled package (generated by `pnpm notices`, which the
# release workflow runs before packaging). Electron/Chromium add their own.
# Shipped as .txt so every OS opens them without asking which app to use.
extraResources:
  # electron-builder drops every *.d.ts from node_modules, even when listed under
  # `files`, but the bundled TypeScript language server needs its standard library
  # (lib.dom.d.ts...) to know what `console` is. Only works while asar is off.
  - from: node_modules/typescript-lsp/lib
    to: app/node_modules/typescript-lsp/lib
    filter:
      - "*.d.ts"
  - from: ../../LICENSE
    to: LICENSE.txt
  - from: ../../THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.txt

# See PLAN.md's packaging section: kept unpacked (no asar) for v1 so the
# plugin loader's dynamic `import()` of each plugin's entry file (ESM) never
# has to go through Electron's asar virtual filesystem, which has historical
# gaps for ESM `import()` (fs/require are well-supported, ESM less so).
# Revisit once verified end-to-end on all three OSes.
asar: false

# Registers the yggdrasil:// scheme with the OS (Info.plist CFBundleURLTypes
# on mac, registry on Windows) so a browser redirect from Google's OAuth
# consent screen (connectors.google.authUrl) can hand back into this app —
# see main/index.ts's app.on("open-url"/"second-instance").
protocols:
  name: Yggdrasil OAuth Callback
  schemes:
    - yggdrasil

# No `publish` block on purpose: there is no official update server. To ship
# auto-updates for your own build, host the installers + `latest*.yml` and set
# YGGDRASIL_UPDATE_URL at runtime (see src/main/autoUpdate.ts).

win:
  target: nsis
  icon: resources/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - dmg
    - zip
  icon: resources/icon.icns
  category: public.app-category.developer-tools

linux:
  target:
    - AppImage
    - deb
  icon: resources/icon.png
  category: Development

# The default name comes from package.json ("@yggdrasil/app-desktop"), whose
# scope turns into a folder that doesn't exist and makes fpm fail.
deb:
  packageName: yggdrasil-desktop
  artifactName: yggdrasil-desktop_${version}_${arch}.${ext}
