# Link server behind a Cloudflare Tunnel: no public IP or open ports needed.
# NOT TESTED against a real Cloudflare account yet. Setup: deploy/README.md
#
#   docker compose -f deploy/docker-compose.cloudflare.yml up -d
#
# Pulls the published image; YGGDRASIL_VERSION in deploy/.env pins its version.
# To build it from this checkout instead, see docker-compose.build.yml.

services:
  gateway:
    image: ghcr.io/mauriciorossdev/yggdrasil-gateway:${YGGDRASIL_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    # No published ports: only the tunnel reaches it.
    volumes:
      - yggdrasil-data:/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - gateway
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in deploy/.env}

volumes:
  yggdrasil-data:
