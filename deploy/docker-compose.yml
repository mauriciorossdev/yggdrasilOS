# Link server on a machine with a public IP and a domain, with automatic TLS.
# Setup and usage: deploy/README.md
#
#   docker compose -f deploy/docker-compose.yml up -d --build

services:
  gateway:
    build:
      context: ..
    image: yggdrasil-gateway
    restart: unless-stopped
    env_file: .env
    # No published ports: only Caddy reaches it, so nothing is exposed unencrypted.
    volumes:
      - yggdrasil-data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - gateway
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in deploy/.env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  yggdrasil-data:
  caddy-data:
  caddy-config:
