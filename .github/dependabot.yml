version: 2
updates:
  # Keep the workflow actions current (low volume).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Workspace dependencies, grouped so a week's updates arrive as one PR per kind.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
