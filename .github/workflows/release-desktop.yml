name: Release desktop app

# Separate from publish.yml (npm packages, manual only) on purpose. The same
# app-desktop-v* tag also publishes the gateway image (gateway-image.yml).
on:
  push:
    tags:
      - "app-desktop-v*"
  # Builds the installers from any branch without a tag, to check the build.
  # It only uploads them as artifacts, like a tag push.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      # better-sqlite3 has no prebuilt binaries and compiles on install. The
      # node-gyp bundled with pnpm doesn't recognise the runner's Visual Studio
      # 2026 (version 18), so point installs at one that does (13.0.1+).
      # @electron/rebuild gets the same version from the root pnpm.overrides.
      - name: Use a node-gyp that knows Visual Studio 2026
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npm install -g node-gyp@13.1.0
          echo "npm_config_node_gyp=$(npm prefix -g)/node_modules/node-gyp/bin/node-gyp.js" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      # Same as test.yml: builds every workspace package in dependency
      # order, not just app-desktop, since it depends on @yggdrasil/cli,
      # gateway, kernel, etc. as workspace packages.
      - run: pnpm build

      # Regenerate the third-party license notices from the lockfile as
      # installed on this runner so the installer never ships a stale list
      # (electron-builder.yml copies it into resources).
      - run: pnpm notices

      # Code signing is intentionally not configured yet (see the app-desktop
      # production-readiness plan). Without this, electron-builder on Windows
      # falls back to an ad-hoc signing path that needs symlink permissions
      # it doesn't have here — this variable stops it from even trying.
      # Remove once real CSC_LINK/CSC_KEY_PASSWORD secrets are wired in.
      - name: Build installer
        run: pnpm --filter @yggdrasil/app-desktop exec electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v7
        with:
          name: yggdrasil-desktop-${{ matrix.os }}
          path: |
            packages/app-desktop/release/*.dmg
            packages/app-desktop/release/*.zip
            packages/app-desktop/release/*.exe
            packages/app-desktop/release/*.AppImage
            packages/app-desktop/release/*.deb
            packages/app-desktop/release/latest*.yml
          if-no-files-found: ignore

      # TODO: once the self-hosted storage for installers + latest*.yml
      # manifests exists (see plan), replace the upload-artifact step above
      # (or add alongside it) with a real deploy step here, e.g.:
      #   - name: Upload to self-hosted storage
      #     run: <rsync/scp/aws s3 cp/etc. to your own host>
      #     env:
      #       DEPLOY_TARGET: ${{ secrets.DESKTOP_RELEASE_UPLOAD_TARGET }}
