name: Gateway image

# Publishes the link server image (Dockerfile) to GHCR with each desktop release:
# the desktop's "Create my link server" wizard pulls the tag matching its own
# version. Pull requests only build and smoke test it, without pushing.
on:
  push:
    tags:
      - "app-desktop-v*"
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-entrypoint.sh
      - deploy/**
      - packages/**
      - extensions/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/gateway-image.yml

permissions:
  contents: read

concurrency:
  group: gateway-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Lowercase on purpose: an image name can't contain the repo's capitals.
  IMAGE: ghcr.io/mauriciorossdev/yggdrasil-gateway

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # The wizard derives the image tag from the app's version, so a tag that
      # doesn't match it would publish an image no wizard asks for.
      - name: Check the tag matches the app version
        if: github.event_name == 'push'
        run: |
          want="app-desktop-v$(node -p "require('./packages/app-desktop/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match packages/app-desktop/package.json ($want)." >&2
            exit 1
          fi

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: yggdrasil-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          if docker run --rm yggdrasil-gateway:ci; then
            echo "The image started without YGGDRASIL_API_KEY." >&2
            exit 1
          fi
          docker run -d --name gw -e YGGDRASIL_API_KEY="$(openssl rand -hex 32)" -p 8787:8787 yggdrasil-gateway:ci
          ok=""
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/ | grep -q '"service":"yggdrasil-gateway"'; then ok=1; break; fi
            sleep 2
          done
          docker logs gw
          docker rm -f gw
          [ -n "$ok" ] || { echo "The gateway never answered on port 8787." >&2; exit 1; }

      - name: Image tags
        id: meta
        if: github.event_name == 'push'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          # app-desktop-v0.2.0 → 0.2.0, plus latest unless it's a prerelease (0.2.0-beta.1).
          tags: |
            type=match,pattern=app-desktop-v(.*),group=1
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
