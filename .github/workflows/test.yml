name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # app-desktop's postinstall rebuilds native modules for Electron, which
      # leaves better-sqlite3 unusable from plain Node (where the tests run).
      # Rebuild it for Node before testing.
      - run: pnpm rebuild better-sqlite3

      # Builds every workspace package in dependency order; the desktop app
      # and gateway depend on the others being compiled first.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm test:e2e

  # Real-model tests. Secrets are not available to pull requests from forks, so
  # this only runs on pushes to main, and skips itself when the key is not set.
  test-live-ollama:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
    steps:
      - name: Skip when no API key is configured
        if: env.OLLAMA_API_KEY == ''
        run: echo "OLLAMA_API_KEY is not set; skipping live tests."

      - uses: actions/checkout@v4
        if: env.OLLAMA_API_KEY != ''

      - uses: pnpm/action-setup@v4
        if: env.OLLAMA_API_KEY != ''

      - uses: actions/setup-node@v4
        if: env.OLLAMA_API_KEY != ''
        with:
          node-version: "22"
          cache: pnpm

      - if: env.OLLAMA_API_KEY != ''
        run: pnpm install --frozen-lockfile

      - if: env.OLLAMA_API_KEY != ''
        run: pnpm rebuild better-sqlite3

      - if: env.OLLAMA_API_KEY != ''
        run: pnpm build

      - if: env.OLLAMA_API_KEY != ''
        run: pnpm test:live
        env:
          YGGDRASIL_TEST_MODEL: gemma4:31b-cloud
